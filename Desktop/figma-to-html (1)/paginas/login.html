<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessar Serviços</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="container">
        <!-- Topo com logo e título -->
        <header>
            <a href="/index.html"><img src="../images/logo_viamobilidade.png" alt="Logo ViaMobilidade" id="logo_header"></a>
            <h1>Acessar Painel Admin</h1>
        </header>

        <!-- Área de Login -->
        <main>
            <div id="login_box">
                <h2>Login</h2>
                <form action="/paginas/main_admin.html" method="get">
                    <div class="caixa_input">
                        <label for="usuario">Usuário:</label>
                        <input type="text" id="usuario" name="usuario">
                        <img src="../images/icone_pessoa.png" alt="Ícone de login">
                    </div>
                    <div class="caixa_input">
                        <label for="senha">Senha:</label>
                        <input type="password" id="senha" name="senha">
                        <img src="../images/icone_cadeado.png" alt="Ícone de cadeado">
                    </div>
                    <a href="#" class="esqueci_senha">Esqueci minha senha</a>
                    <br>
                    <div id="caixa_botao">
                        <button type="submit">ENTRAR</button>
                    </div>
                </form>
            </div>
        </main>

        <!-- Rodapé com links -->
        <footer>
            <img src="../images/logo_ccr.png" alt="Logo CCR" class="logo-ccr">
            <div id="caixa_texto">
                <p>Precisa de ajuda?</p>
                <p><a href="#">Fale com nosso FAQ Interativo!</a></p>
            </div>
        </footer>

        <script src="../js/script.js"></script>
    </div>
</body>
</html>
