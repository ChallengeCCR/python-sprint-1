<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessar Serviços</title>
    <link rel="stylesheet" href="../css/index.css">
</head>
<body>
    <div class="container">
        <!-- Topo com logo e título -->
        <header>
            <a href="/index.html"><img src="../images/logo_viamobilidade.png" alt="Logo ViaMobilidade" id="logo_header"></a>
            <h1>Painel de Admin</h1>
        </header>
        <!-- Tela Inicial -->
        <main>

            <!-- Barra de navegação -->
            <nav  id="nav_box">
                <ul>
                    <li>
                        <a href="#">
                            <img src="/images/icone_pessoa.png" alt="Ícone de usuário">
                            <p>Admin</p>
                        </a>
                    </li>
                    <li>
                        <a href="../paginas/login.html">
                            <img src="/images/imagem_logout.png" alt="Ícone de usuário">
                            <p>Sair</p>
                        </a>
                    </li>
                </ul>
            </nav>

            <!-- Botões -->
            <div id="main_box">
           
                <a href="paginas/status_linha.html">
                    <div class="caixa_funcionalidade">
                        <img src="images/imagem_linha.png" alt="Ícone de um trilho">
                        <p>Ver alertas de incidentes ativos</p>
                    </div>
                </a>

                <a href="paginas/status_estacao.html">
                    <div class="caixa_funcionalidade">
                        <img src="images/imagem_estacao.png" alt="Ícone de uma estação">
                        <p>Ver histórico de alertas encerrados</p>
                    </div>
                </a>

                <a href="paginas/status_trem.html">
                    <div class="caixa_funcionalidade">
                        <img src="images/imagem_estacao.png" alt="Ícone de uma estação">
                        <p>Registrar alerta</p>
                    </div>
                </a>

                <a href="paginas/status_alerta.html">
                    <div class="caixa_funcionalidade">
                        <img src="../images/imagem_aviso.png" alt="ícone de um sino">
                        <p>Remover alerta</p>
                    </div>
                </a>
            </div>
        </main>

        <!-- Rodapé com links -->
        <footer>
            <img src="../images/logo_ccr.png" alt="Logo CCR" class="logo-ccr">
            <div id="caixa_texto">
                <p>Precisa de ajuda?</p>
                <p><a href="#">Fale com nosso FAQ Interativo!</a></p>
            </div>
        </footer>
    </div>
</body>
</html>
